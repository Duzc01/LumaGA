name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image may not ship platform 36 yet; AGP downloads missing
      # SDK components automatically when licenses are pre-accepted.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      # The Rust `logic` library ships prebuilt in logic/src/main/jniLibs, so
      # the APK build itself needs no NDK / Rust toolchain on CI. Building it
      # from rust/ is covered by rust.yml.
      #
      # Signing: the release keystore/passwords live in repo secrets (push
      # builds only; PRs from forks have no secret access and stay unsigned,
      # which is fine for a build-check).
      - name: Inject release signing (push builds only)
        if: github.event_name == 'push'
        env:
          KEYSTORE_B64: ${{ secrets.LUMA_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.LUMA_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.LUMA_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          cat > app/release-keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASS
          keyAlias=luma
          keyPassword=$KEY_PASS
          EOF

      - name: Build
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
