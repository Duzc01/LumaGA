name: Emulator Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  instrumented-test:
    name: Instrumented tests on emulator
    # NOTE: the ubuntu runners here have no KVM and the macOS runners have no
    # nested virtualization (HVF error), so the emulator always runs with
    # software rendering. .github/scripts/run-emulator-tests.sh manages the
    # emulator lifecycle itself and retries the test run on infra flakes.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The runner image may not ship every SDK component yet; AGP downloads
      # missing components automatically when licenses are pre-accepted.
      - name: Accept Android SDK licenses
        run: |
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"

      # Build everything BEFORE the emulator starts so the heavy Kotlin/dex
      # work doesn't compete with the software-rendered emulator for CPU.
      - name: Pre-build APKs
        run: ./gradlew assembleDebug assembleDebugAndroidTest -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" --stacktrace

      - name: Run local unit tests
        run: ./gradlew testDebugUnitTest -Dorg.gradle.jvmargs="-Xmx2g -Dfile.encoding=UTF-8" --stacktrace

      - name: Run instrumented tests on emulator
        run: bash .github/scripts/run-emulator-tests.sh

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-test-reports
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            app/build/test-results/testDebugUnitTest
