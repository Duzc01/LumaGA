name: Rust

# Separate from the APK workflow: the Android builds compile OpenSSL from
# source once per ABI, so this takes far longer than ./gradlew assembleDebug
# and only needs to run when the Rust sources change.
#
# On pushes to main, the freshly built liblogic.so files and the regenerated
# Kotlin protobuf gencode are committed back to the branch automatically, so
# the APK workflow always builds against the .so / gencode matching rust/.
# The commit-back only touches logic/**, which is outside this workflow's
# paths filter, so it never re-triggers itself.
on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  pull_request:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust.yml"]
  workflow_dispatch:

permissions:
  contents: write # needed for the commit-back on push builds

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build liblogic.so
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      # The Rust protobuf bindings are generated at build time and protoc-rust
      # shells out to protoc. Pinned to 35.1 (not 35.x latest) so the Kotlin
      # gencode regenerated below matches the checked-in files, which came
      # from protoc 35.1 targeting the protobuf 4.35.1 runtime pinned in
      # gradle/libs.versions.toml.
      - name: Set up protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "35.1"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      # rust-toolchain.toml pins the channel and the three Android targets, so
      # rustup installs everything on the first cargo call.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2

      - name: Unit tests
        # Placeholders: auth.rs's test-only default expects these to exist. The
        # real values live in a local .env and no test here needs them.
        env:
          AUTH_DEBUG_UID: "0"
          AUTH_DEBUG_TOKEN: "none"
        run: |
          cargo test -p service --lib test_extract_error_shapes
          cargo test -p service --lib test_sanitize_control_chars_in_json_strings

      # The runner ships several NDKs; pin the newest one for the steps below.
      - name: Select NDK
        run: echo "ANDROID_NDK_HOME=${ANDROID_NDK_LATEST_HOME:?no NDK on this runner}" >> "$GITHUB_ENV"

      - name: Build
        run: |
          "$ANDROID_NDK_HOME/ndk-build" --version | head -1
          ./build-jni-libs.sh

      # A missing or renamed symbol only surfaces at System.loadLibrary time in
      # the app, so assert the JNI entry points here. This uses the NDK's
      # llvm-readelf because GNU readelf clips symbol names to 25 characters
      # unless given -W, and these names are 40 and 45 characters long.
      - name: Check JNI symbols
        run: |
          readelf=("$ANDROID_NDK_HOME"/toolchains/llvm/prebuilt/*/bin/llvm-readelf)
          [[ -x "${readelf[0]}" ]] || { echo "error: llvm-readelf not found under $ANDROID_NDK_HOME"; exit 1; }
          for abi in arm64-v8a x86_64 x86; do
            so="../logic/src/main/jniLibs/$abi/liblogic.so"
            found=" $("${readelf[0]}" --dyn-syms "$so" \
              | grep -oE 'Java_com_bugenzhao_mnga_LogicKt_rustCall(Async)?' | sort -u | tr '\n' ' ')"
            for sym in rustCall rustCallAsync; do
              [[ "$found" == *" Java_com_bugenzhao_mnga_LogicKt_$sym "* ]] || {
                echo "error: $abi missing Java_com_bugenzhao_mnga_LogicKt_$sym (exported:$found)"
                exit 1
              }
            done
            echo "$abi ok:$found"
          done

      # For inspection only; the committed .so files below stay the source of
      # truth for the APK. Builds are not reproducible byte-for-byte, so they
      # are not compared against these.
      - name: Upload libraries
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: logic/src/main/jniLibs/*/liblogic.so
          if-no-files-found: error

      # Regenerate the Kotlin protobuf gencode from rust/protos, same inputs
      # as rust/gen-kotlin-protos.sh but --java_out only: the Kotlin DSL
      # (*Kt.kt) is unused by the app (Java builders only), and
      # protoc-gen-kotlin is distributed neither via Maven nor in the protoc
      # release zips, so it is unavailable here.
      - name: Regenerate Kotlin protobuf gencode
        if: github.event_name == 'push'
        run: protoc --java_out="../logic/src/main/java" -I protos protos/*.proto

      # Commit the rebuilt .so files and the regenerated gencode back to main
      # so the APK workflow picks them up. Push builds only: PRs never push.
      - name: Commit rebuilt libraries and gencode
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ../logic/src/main/jniLibs ../logic/src/main/java/com/bugenzhao/mnga/protos
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: rebuild liblogic.so and protobuf gencode from ${GITHUB_SHA::8}"
            git push
          fi
